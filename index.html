<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Namenskugeln · Lohmarer Weihnachtsmarkt</title>
  <meta name="description" content="Weihnachtskugeln mit deinem Namen – live am Stand der MBG Lohmar 3D-gedruckt. Einfach gestalten, an der Kasse bezahlen, abholen.">
  <meta name="theme-color" content="#fffbf3">
  <meta name="apple-mobile-web-app-title" content="Namenskugeln">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/italiana-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/josefin-latin-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css?v=3">
  <link rel="stylesheet" href="css/shop.css?v=3">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <img class="mbg" src="img/mbg-logo.svg" alt="MBG Lohmar" width="68" height="44">
      <div id="topRight"></div>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <div class="dock" id="dock" hidden>
    <div class="wrap">
      <div class="sum"><small id="dockLabel">1 Kugel</small><b class="num" id="dockTotal">2,50 €</b><s id="dockStrike" hidden></s></div>
      <button class="btn" id="dockBtn">Weiter</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/config.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/icons.js?v=3"></script>
  <script src="js/shop.js?v=3"></script>
</body>
</html>
